# The demo, published.
#
# A distributed app has nothing to deploy but the client itself: there is no
# server behind this page. Two visitors who open it become peers of each other.
#
# `PAGES_BASE` is what makes it survive the sub-path a project site is served
# from — Vite rewrites the asset URLs, and `BASE_URL` carries the same prefix
# into the engine loader, which resolves GenosDB's optional modules relative to
# itself. Without it the build looks clean and answers 404 for `sm-acls.min.js`.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; the newest push is the one worth publishing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build
        env:
          PAGES_BASE: /dCampaigns/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
